name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build all packages
        run: pnpm build

      - name: Run tests
        run: pnpm test -- --run

      - name: Package VS Code extension
        run: cd packages/extension && npx vsce package --no-dependencies

      - name: Get extension filename
        id: vsix
        run: echo "filename=$(ls packages/extension/*.vsix)" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.vsix.outputs.filename }}
          generate_release_notes: true
          body: |
            ## Install

            ### VS Code Extension
            1. Download the `.vsix` file below
            2. In VS Code: `Extensions` → `...` → `Install from VSIX...`
            3. Or via CLI: `code --install-extension <downloaded-file>.vsix`

            ### MCP Server (npm)
            ```bash
            npm install -g aieye
            ```
